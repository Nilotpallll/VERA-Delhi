name: VERA Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-frontend:
    name: Contracts & Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test contracts
        run: |
          npm run build:contracts
          npm run typecheck:contracts
          npm run test:contracts

      - name: Lint and typecheck web
        run: |
          npm run lint:web
          npm run typecheck:web

      - name: Build web application
        run: npm run build:web

  backend-and-contracts:
    name: Backend API & Scoring Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff==0.17.1 pytest pytest-asyncio httpx

      - name: Run Ruff Lint Check
        run: ruff check apps/api

      - name: Run Pytest Suite (Unit & Functional)
        env:
          PYTHONPATH: .
        run: pytest apps/api/tests -v

  database-and-migrations:
    name: Postgres + pgvector Service & Migrations CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: vera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff==0.17.1 pytest pytest-asyncio httpx alembic psycopg2-binary "psycopg[binary]" asyncpg

      - name: Run Alembic Upgrade Head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@127.0.0.1:5432/vera_test
        run: alembic upgrade head

      - name: Run Alembic Downgrade -1
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@127.0.0.1:5432/vera_test
        run: alembic downgrade -1

      - name: Run Alembic Upgrade Head (Re-apply)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@127.0.0.1:5432/vera_test
        run: alembic upgrade head

      - name: Run Full Pytest Suite against Live Postgres
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@127.0.0.1:5432/vera_test
          PYTHONPATH: .
        run: pytest apps/api/tests -v


  secret-detection:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files (Rule 11)
        run: |
          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "ERROR: Committed .env file detected! Architecture Rule 11 violated."
            exit 1
          fi
          echo "No committed secret files found."

      - name: Run Gitleaks across full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
